<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      background-image: url('horseman.png');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
    }

    /* Text positioning */
    .center-text {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 575px;
    }

    h1 {
      font-size: 70px;
      font-family: Papyrus, Times, serif;
    }

    /* Button styling */
    .button {
      background-color: #ff4800;
      border: none;
      color: rgb(13, 0, 255);
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 20px;
      font-family: Papyrus, Times, serif;
      font-weight: bold;
      margin: 4px 2px;
      transition-duration: 0.4s;
      cursor: pointer;
      border-radius: 55%;
    }

    .button:hover {
      background-color: #0011ff;
      color: rgb(255, 85, 0);
    }

    /* Button positioning */
    .container {
      height: 300px;
      position: relative;
    }

    .center-button {
      position: absolute;
      top: -85%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <title>homepage</title>
</head>

<body>

  <h1 style="color:rgb(255, 187, 0);" class="center-text">
    Tiffany Yi
  </h1>

  <div class="container">
    <div class="center-button">
      <button onclick="document.location='about.html'" class="button">
        About
      </button>
    </div>
  </div>

</body>

</html>
